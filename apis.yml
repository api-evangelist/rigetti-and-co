aid: rigetti-and-co
name: Rigetti & Co
description: Rigetti Computing (Rigetti & Co) is a full-stack quantum computing company that builds superconducting
  quantum processors and delivers access to them through Quantum Cloud Services (QCS). The QCS HTTP API
  is an OpenAPI 3.0.2 REST/RPC interface (aligned with Google API Improvement Proposals) for discovering
  quantum processors and their instruction set architectures, reserving execution time, opening execution
  engagements against endpoints, and managing accounts and billing. Quantum programs are built and run
  with the pyQuil and qcs-sdk Python/Rust SDKs, while low-latency job execution, readout, and translation
  run over a companion gRPC surface. Authentication is OAuth2 (Okta) bearer JWT. Surfaced as an a16z portfolio
  company and enriched by the API Evangelist pipeline from Rigetti's published OpenAPI, gRPC protos, client
  packages, and QCS documentation.
